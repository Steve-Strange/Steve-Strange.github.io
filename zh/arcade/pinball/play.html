<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#242529">
  <meta name="description" content="参考经典 Space Cadet 台面风格的三维太空弹球。">
  <title>三维弹球｜游戏室</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; }
    body { margin: 0; overflow: hidden; background: #242529; color: #eee9da; font-family: Arial, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    .hud { position: fixed; inset: 0; z-index: 2; pointer-events: none; }
    .topbar { position: absolute; top: max(14px, env(safe-area-inset-top)); right: 18px; left: 18px; display: flex; justify-content: space-between; align-items: flex-start; }
    .back { width: 36px; height: 36px; display: grid; place-items: center; border: 1px solid #9c9e9b; border-radius: 2px; color: #e9e8e0; background: #37383a; pointer-events: auto; text-decoration: none; font-size: 24px; }
    .stats { display: flex; gap: 24px; text-align: right; }
    .stat span { display: block; color: #c6c4bb; font-size: 10px; font-weight: 700; }
    .stat strong { display: block; min-width: 54px; color: #f2ca69; font: 700 22px/1.15 "Courier New", monospace; }
    .message { position: absolute; top: 44%; left: 50%; translate: -50% -50%; width: min(90vw, 470px); text-align: center; pointer-events: auto; }
    .message h1 { margin: 0 0 8px; color: #f4e3b4; font-size: 32px; letter-spacing: 0; text-shadow: 0 2px 3px #000; }
    .message p { margin: 5px 0; color: #c5cfce; font-size: 13px; line-height: 1.45; }
    .message .rules { color: #fff; font-weight: 700; }
    .message button { min-width: 150px; height: 40px; margin-top: 14px; border: 2px outset #f4f0dc; border-radius: 2px; color: #25262a; background: #d9d5c5; font: 800 13px Arial, sans-serif; cursor: pointer; }
    .source-link { display: block; width: max-content; max-width: 100%; margin: 12px auto 0; color: #e0d7bd; font-size: 11px; text-decoration: underline; }
    .source-link:hover, .source-link:focus-visible { color: #fff; }
    .message[hidden] { display: none; }
    .controls { position: absolute; right: 0; bottom: max(18px, env(safe-area-inset-bottom)); left: 0; display: flex; justify-content: center; gap: 14px; pointer-events: auto; }
    .control { width: 60px; height: 42px; border: 2px outset #d8d8d0; border-radius: 2px; color: #242529; background: #b8b9b4; font: 800 23px Arial, sans-serif; touch-action: none; cursor: pointer; }
    .control svg { width: 20px; height: 20px; vertical-align: middle; }
    .control-launch { width: 72px; color: #30291d; background: #d6b565; border-color: #e9d39c; }
    .control:active, .control.is-active { border-style: inset; background: #939790; }
    button:focus-visible, a:focus-visible { outline: 2px solid #f4d484; outline-offset: 3px; }
    .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; }
    @media (max-height: 400px) { .topbar { top: 9px; } .stat strong { font-size: 18px; } .controls { bottom: 9px; } .control { height: 36px; } }
  </style>
  <link rel="stylesheet" href="/assets/game-embed.css">
  <script src="/assets/game-bridge.js"></script>
  <script defer src="/lib/lucide/lucide.min.js"></script>
<meta name="robots" content="noindex, follow"><link rel="canonical" href="https://steve-strange.github.io/zh/arcade/pinball/"></head>
<body data-theme="classic">
  <canvas id="scene" aria-label="蓝色太空印刷台面、银色轨道和红白碰撞器的经典三维弹球台"></canvas>
  <div class="hud">
    <div class="topbar">
      <a class="back" href="/zh/arcade/" aria-label="返回游戏库" title="返回游戏库">‹</a>
      <div class="stats">
        <div class="stat"><span>得分</span><strong id="score">000000</strong></div>
        <div class="stat"><span>倍率</span><strong id="multiplier">1×</strong></div>
        <div class="stat"><span>剩余球</span><strong id="balls">3</strong></div>
      </div>
    </div>
    <div class="message" id="message">
      <h1>三维弹球</h1>
      <p class="rules" id="rules">撞击保险杠得分 · 点亮三枚目标提升倍率 · 每局 3 球</p>
      <p id="controls-copy"><b>A / ←</b> 左挡板　<b>D / →</b> 右挡板　<b>Space</b> 发球　<b>R</b> 重开</p>
      <button type="button" id="start">发球</button>
      <a class="source-link" href="https://alula.github.io/SpaceCadetPinball/" target="_blank" rel="noopener noreferrer">台面风格参考：经典 Space Cadet ↗</a>
    </div>
    <div class="controls" aria-label="弹球控制">
      <button class="control" id="left" type="button" aria-label="左挡板" title="左挡板"><i data-lucide="arrow-up-left"></i></button>
      <button class="control control-launch" id="launch" type="button" aria-label="发球" title="发球"><i data-lucide="arrow-up"></i></button>
      <button class="control" id="right" type="button" aria-label="右挡板" title="右挡板"><i data-lucide="arrow-up-right"></i></button>
    </div>
    <p class="sr-only" id="live" aria-live="polite">等待发球</p>
  </div>

  <script src="/lib/three-r160/three.min.js"></script>
  <script src="/lib/matter/matter.min.js"></script>
  <script>
    (() => {
      'use strict';
      const { Engine, World, Bodies, Body, Events } = Matter;
      const W = 600;
      const H = 900;
      const SCALE = 60;
      const canvas = document.getElementById('scene');
      const scoreNode = document.getElementById('score');
      const multiplierNode = document.getElementById('multiplier');
      const ballsNode = document.getElementById('balls');
      const message = document.getElementById('message');
      const rules = document.getElementById('rules');
      const controlsCopy = document.getElementById('controls-copy');
      const live = document.getElementById('live');
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(42, 1, .1, 100);
      const engine = Engine.create({ enableSleeping: false });
      const meshes = new Map();
      const flashes = new Map();
      const targets = [];
      const targetLit = new Set();
      const keys = { left: false, right: false };
      let ball;
      let ballMesh;
      let leftFlipper;
      let rightFlipper;
      let score = 0;
      let balls = 3;
      let multiplier = 1;
      let targetBankLocked = false;
      let leftPlungerLane = false;
      let state = 'idle';
      let lastTime = performance.now();
      let drainDelay = 0;
      let targetResetDelay = 0;

      renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
      renderer.setClearColor(0x242529, 1);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;

      const ambient = new THREE.HemisphereLight(0xffffff, 0x555862, 2.1);
      const keyLight = new THREE.DirectionalLight(0xfff6e5, 2.5);
      keyLight.position.set(-7, 15, -4);
      keyLight.castShadow = true;
      keyLight.shadow.mapSize.set(1024, 1024);
      Object.assign(keyLight.shadow.camera, { left: -10, right: 10, top: 12, bottom: -12 });
      keyLight.shadow.bias = -.001;
      scene.add(ambient, keyLight);

      function toX(x) { return (x - W / 2) / SCALE; }
      function toZ(y) { return (y - H / 2) / SCALE; }
      function material(color, emissive = 0x000000) {
        return new THREE.MeshPhongMaterial({ color, emissive, shininess: 100, specular: 0x777777 });
      }

      const board = new THREE.Mesh(new THREE.BoxGeometry(W / SCALE + .2, .5, H / SCALE + .2), material(0x45464b));
      board.position.y = -.26;
      board.receiveShadow = true;
      scene.add(board);

      const art = document.createElement('canvas');
      art.width = W * 2;
      art.height = H * 2;
      const artCtx = art.getContext('2d');
      artCtx.scale(2, 2);
      artCtx.fillStyle = '#273b69'; artCtx.fillRect(0, 0, W, H);
      artCtx.strokeStyle = '#426087'; artCtx.lineWidth = 1;
      for (let y = -50; y < H; y += 44) {
        artCtx.beginPath(); artCtx.moveTo(35, y); artCtx.lineTo(500, y + 130); artCtx.stroke();
      }
      for (let x = -450; x < W; x += 58) {
        artCtx.beginPath(); artCtx.moveTo(x, 0); artCtx.lineTo(x + 530, H); artCtx.stroke();
      }
      for (let i = 0; i < 95; i++) {
        const x = 45 + (i * 137 % 446), y = 120 + (i * 193 % 630);
        artCtx.fillStyle = i % 4 ? '#819bb2' : '#d9d5bd';
        artCtx.fillRect(x, y, i % 4 ? 1 : 2, i % 4 ? 1 : 2);
      }
      function inkPath(points, fill, stroke = '#a6a8ad', width = 3) {
        artCtx.beginPath(); points.forEach(([x, y], i) => i ? artCtx.lineTo(x, y) : artCtx.moveTo(x, y));
        artCtx.closePath(); artCtx.fillStyle = fill; artCtx.fill(); artCtx.strokeStyle = stroke; artCtx.lineWidth = width; artCtx.stroke();
      }
      function insert(x, y, radius, color) {
        artCtx.beginPath(); artCtx.arc(x, y, radius + 3, 0, Math.PI * 2); artCtx.fillStyle = '#171e35'; artCtx.fill();
        artCtx.beginPath(); artCtx.arc(x, y, radius, 0, Math.PI * 2); artCtx.fillStyle = color; artCtx.fill();
        artCtx.strokeStyle = '#b8ab75'; artCtx.lineWidth = 1; artCtx.stroke();
      }
      inkPath([[44, 790], [76, 400], [105, 350], [138, 452], [118, 725], [180, 816]], '#64558b');
      inkPath([[502, 84], [572, 84], [572, 862], [518, 862]], '#34363e');
      inkPath([[153, 796], [224, 725], [250, 803], [275, 645], [300, 835], [326, 645], [351, 803], [379, 725], [447, 796], [343, 877], [257, 877]], '#75609d', '#aa88bb');
      inkPath([[98, 611], [222, 662], [111, 714]], '#873c42', '#e0c8a3', 5);
      inkPath([[498, 611], [378, 662], [487, 714]], '#873c42', '#e0c8a3', 5);
      for (const x of [127, 473]) {
        inkPath([[x, 657], [x - 9, 682], [x + 16, 668], [x - 16, 668], [x + 9, 682]], '#d8bb78', '#eeddae', 1);
      }
      for (let i = 0; i < 16; i++) {
        const angle = i * Math.PI / 8;
        insert(300 + Math.cos(angle) * 72, 625 + Math.sin(angle) * 72, 8, i % 4 === 0 ? '#d79c42' : '#2a5480');
      }
      insert(300, 625, 47, '#3f738b');
      artCtx.strokeStyle = '#b4d0ce'; artCtx.lineWidth = 1.5;
      for (const radius of [20, 35, 45]) { artCtx.beginPath(); artCtx.ellipse(300, 625, radius / 2, 45, .3, 0, Math.PI * 2); artCtx.stroke(); }
      artCtx.beginPath(); artCtx.moveTo(255, 625); artCtx.lineTo(345, 625); artCtx.stroke();
      for (const [x, y, r] of [[205, 245, 53], [390, 255, 53], [300, 390, 57], [175, 505, 43], [425, 510, 43]]) {
        artCtx.strokeStyle = '#c4b78d'; artCtx.lineWidth = 3; artCtx.beginPath(); artCtx.arc(x, y, r, 0, Math.PI * 2); artCtx.stroke();
        for (let i = 0; i < 3; i++) insert(x - 22 + i * 22, y + r + 18, 5, '#d4b84e');
      }
      for (let y = 300; y < 780; y += 38) { insert(58, y, 5, '#d6b644'); insert(480, y, 5, '#bda240'); }
      for (const [x, y] of [[125, 286], [340, 475], [442, 320]]) {
        inkPath([[x - 18, y + 35], [x - 6, y], [x - 18, y + 4], [x + 3, y - 24], [x + 19, y + 4], [x + 7, y], [x - 2, y + 35]], '#b64440', '#d4b466', 2);
      }
      artCtx.textAlign = 'center'; artCtx.fillStyle = '#d7c6e0'; artCtx.font = 'italic 900 32px Arial';
      artCtx.fillText('SPACE PATROL', 282, 78);
      artCtx.fillStyle = '#dfca83'; artCtx.font = '700 11px Arial'; artCtx.fillText('ORBITAL MISSION', 282, 99);
      artCtx.font = '700 10px Arial'; artCtx.fillText('TARGET BANK', 300, 553); artCtx.fillText('RE-ENTRY', 300, 720);
      artCtx.save(); artCtx.translate(548, 555); artCtx.rotate(-Math.PI / 2); artCtx.fillText('LAUNCH RAMP', 0, 0); artCtx.restore();
      artCtx.fillStyle = '#d8c8a4'; artCtx.font = '700 13px Arial'; artCtx.fillText('3D PINBALL', 300, 865);
      const texture = new THREE.CanvasTexture(art);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
      const boardArt = new THREE.Mesh(
        new THREE.PlaneGeometry(W / SCALE, H / SCALE),
        new THREE.MeshPhongMaterial({ map: texture, shininess: 18, specular: 0x292929 })
      );
      boardArt.rotation.x = -Math.PI / 2;
      boardArt.position.y = .005;
      boardArt.receiveShadow = true;
      scene.add(boardArt);

      function addBox(x, y, width, height, angle = 0, color = 0x9b9da1, label = 'wall', depth = .32) {
        const restitution = label === 'slingshot' ? 1.18 : label.startsWith('target') ? .9 : .65;
        const body = Bodies.rectangle(x, y, width, height, { isStatic: true, angle, label, restitution, friction: 0 });
        const mesh = new THREE.Mesh(new THREE.BoxGeometry(width / SCALE, depth, height / SCALE), material(color));
        mesh.userData.height = depth;
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        scene.add(mesh);
        meshes.set(body.id, mesh);
        World.add(engine.world, body);
        syncMesh(body);
        return body;
      }

      function addBumper(x, y, radius, color) {
        const body = Bodies.circle(x, y, radius, { isStatic: true, label: 'bumper', restitution: 1.35, friction: 0 });
        const mesh = new THREE.Group();
        const r = radius / SCALE;
        const base = new THREE.Mesh(new THREE.CylinderGeometry(r, r, .12, 32), material(0xb5b8bc));
        const rubber = new THREE.Mesh(new THREE.TorusGeometry(r * .86, .075, 8, 32), material(0x292a2a));
        rubber.rotation.x = Math.PI / 2; rubber.position.y = .10;
        const cap = new THREE.Group(); cap.position.y = .23;
        cap.add(new THREE.Mesh(new THREE.CylinderGeometry(r * .78, r * .9, .15, 32), material(0xe4ddc7)));
        for (let i = 0; i < 4; i++) {
          const segment = new THREE.Mesh(new THREE.CylinderGeometry(r * .76, r * .76, .018, 12, 1, false, i * Math.PI / 2, Math.PI / 4), material(color));
          segment.position.y = .084; cap.add(segment);
        }
        const button = new THREE.Mesh(new THREE.CylinderGeometry(r * .29, r * .33, .12, 20), material(0x314d7b));
        button.position.y = .13; cap.add(button);
        mesh.add(base, rubber, cap);
        mesh.traverse(part => { if (part.isMesh) part.castShadow = true; });
        scene.add(mesh);
        meshes.set(body.id, mesh);
        flashes.set(body.id, 0);
        World.add(engine.world, body);
        syncMesh(body);
        return body;
      }

      addBox(15, 450, 30, 900, 0, 0x696b70);
      addBox(585, 450, 30, 900, 0, 0x696b70);
      addBox(300, 15, 600, 30, 0, 0x696b70);
      addBox(505, 520, 12, 610, 0, 0xc0c1b9, 'wall', .18);
      addBox(130, 808, 260, 18, .26);
      addBox(470, 808, 260, 18, -.26);
      addBox(78, 160, 180, 12, -.55, 0xb1b4b8, 'wall', .22);
      addBox(452, 142, 190, 12, .55, 0xb1b4b8, 'wall', .22);
      addBumper(205, 245, 38, 0xa72f32);
      addBumper(390, 255, 38, 0xa72f32);
      addBumper(300, 390, 42, 0xa72f32);
      addBumper(175, 505, 30, 0x324878);
      addBumper(425, 510, 30, 0x324878);
      addBox(168, 635, 122, 12, .38, 0xc8c4b7, 'slingshot', .22);
      addBox(432, 635, 122, 12, -.38, 0xc8c4b7, 'slingshot', .22);
      for (const [index, x] of [[0, 230], [1, 300], [2, 370]]) {
        targets.push(addBox(x, 570, 40, 12, 0, 0xd6b849, `target-${index}`, .28));
      }

      leftFlipper = addBox(255, 735, 118, 24, .35, 0xbc3e38, 'flipper', .24);
      rightFlipper = addBox(345, 735, 118, 24, Math.PI - .35, 0xbc3e38, 'flipper', .24);
      const flipperShape = new THREE.Shape();
      flipperShape.moveTo(-47 / SCALE, -12 / SCALE);
      flipperShape.lineTo(47 / SCALE, -9 / SCALE);
      flipperShape.quadraticCurveTo(59 / SCALE, -9 / SCALE, 59 / SCALE, 0);
      flipperShape.quadraticCurveTo(59 / SCALE, 9 / SCALE, 47 / SCALE, 9 / SCALE);
      flipperShape.lineTo(-47 / SCALE, 12 / SCALE);
      flipperShape.absarc(-47 / SCALE, 0, 12 / SCALE, Math.PI / 2, Math.PI * 1.5, false);
      for (const body of [leftFlipper, rightFlipper]) {
        const old = meshes.get(body.id); scene.remove(old); old.geometry.dispose(); old.material.dispose();
        const mesh = new THREE.Group();
        const geometry = new THREE.ExtrudeGeometry(flipperShape, { depth: .16, bevelEnabled: false, curveSegments: 12 });
        geometry.rotateX(-Math.PI / 2); geometry.translate(0, -.1, 0);
        const rubber = new THREE.Mesh(geometry, material(0xb73833));
        const top = new THREE.Mesh(geometry, material(0xe5ddbf));
        top.scale.set(.96, .6, .73); top.position.y = .085;
        mesh.add(rubber, top); rubber.castShadow = top.castShadow = true;
        mesh.userData.height = .22;
        meshes.set(body.id, mesh); scene.add(mesh);
      }

      // Metal trim follows the existing collision walls and stays outside the ball lane.
      for (const x of [31, 569]) {
        const rail = new THREE.Mesh(new THREE.CylinderGeometry(.035, .035, 14.3, 12), material(0xd4d5d2));
        rail.rotation.x = Math.PI / 2; rail.position.set(toX(x), .35, .1); scene.add(rail);
      }
      for (const [x, y] of [[42, 50], [558, 50], [42, 850], [558, 850]]) {
        const screw = new THREE.Mesh(new THREE.CylinderGeometry(.065, .065, .035, 12), material(0xd9d8ce));
        screw.position.set(toX(x), .035, toZ(y)); scene.add(screw);
      }

      function syncMesh(body) {
        const mesh = meshes.get(body.id);
        if (!mesh) return;
        mesh.position.set(toX(body.position.x), body.label === 'bumper' ? .02 : mesh.userData.height / 2, toZ(body.position.y));
        mesh.rotation.y = -body.angle;
      }

      function positionFlipper(body, pivotX, angle) {
        const half = 59;
        Body.setPosition(body, { x: pivotX + Math.cos(angle) * half, y: 735 + Math.sin(angle) * half }, true);
        Body.setAngle(body, angle, true);
        syncMesh(body);
      }

      function makeBall() {
        if (ball) World.remove(engine.world, ball);
        if (ballMesh) { scene.remove(ballMesh); ballMesh.geometry.dispose(); ballMesh.material.dispose(); }
        ball = Bodies.circle(548, 755, 13, { label: 'ball', restitution: .72, friction: .002, frictionAir: .006, density: .004 });
        ballMesh = new THREE.Mesh(new THREE.SphereGeometry(13 / SCALE, 24, 18), material(0xc4c8d1));
        ballMesh.castShadow = true;
        scene.add(ballMesh);
        World.add(engine.world, ball);
        leftPlungerLane = false;
        state = 'ready';
      }

      function resetTargetBank() {
        targetLit.clear();
        targetBankLocked = false;
        for (const target of targets) meshes.get(target.id).material.emissive.setHex(0x000000);
      }

      function addScore(points) {
        score += points * multiplier;
        scoreNode.textContent = String(score).padStart(6, '0');
      }

      function launch() {
        if (state === 'idle' || state === 'over') {
          drainDelay = targetResetDelay = 0;
          score = 0;
          balls = 3;
          multiplier = 1;
          scoreNode.textContent = '000000';
          ballsNode.textContent = '3';
          multiplierNode.textContent = '1×';
          resetTargetBank();
          makeBall();
        }
        if (state !== 'ready') return;
        message.hidden = true;
        Body.setVelocity(ball, { x: -1.5, y: -34 });
        state = 'playing';
        tone(210, .08);
        live.textContent = '发球';
      }

      function drain() {
        if (state !== 'playing') return;
        state = 'draining';
        balls -= 1;
        ballsNode.textContent = String(balls);
        tone(75, .18);
        if (balls <= 0) {
          state = 'over';
          message.querySelector('h1').textContent = '游戏结束';
          rules.textContent = `最终得分 ${String(score).padStart(6, '0')} · 最高倍率 ${multiplier}×`;
          controlsCopy.textContent = 'Space 或点击重新开始 · R 重开';
          message.querySelector('button').textContent = '再来一局';
          message.hidden = false;
          live.textContent = `游戏结束，得分 ${score}`;
        } else {
          drainDelay = 650;
        }
      }

      function tone(frequency, duration) {
        window.arcadeTone(frequency, duration);
      }

      Events.on(engine, 'collisionStart', event => {
        for (const pair of event.pairs) {
          const other = pair.bodyA === ball ? pair.bodyB : pair.bodyB === ball ? pair.bodyA : null;
          if (!other) continue;
          if (other.label === 'bumper') {
            addScore(100);
            flashes.set(other.id, 1);
            const dx = ball.position.x - other.position.x;
            const dy = ball.position.y - other.position.y;
            const length = Math.hypot(dx, dy) || 1;
            Body.setVelocity(ball, { x: ball.velocity.x + dx / length * 4.5, y: ball.velocity.y + dy / length * 4.5 });
            tone(380 + score % 500, .06);
            navigator.vibrate?.(12);
          } else if (other.label.startsWith('target')) {
            addScore(targetLit.has(other.id) ? 50 : 250);
            targetLit.add(other.id);
            meshes.get(other.id).material.emissive.setHex(meshes.get(other.id).material.color.getHex());
            if (targetLit.size === targets.length && !targetBankLocked) {
              targetBankLocked = true;
              multiplier = Math.min(5, multiplier + 1);
              multiplierNode.textContent = `${multiplier}×`;
              addScore(1000);
              live.textContent = `目标组完成，倍率 ${multiplier} 倍`;
              tone(920, .14);
              targetResetDelay = 700;
            } else tone(620, .06);
          } else if (other.label === 'slingshot') {
            addScore(50);
            tone(280, .045);
          }
        }
      });

      function resize() {
        const width = innerWidth;
        const height = innerHeight;
        renderer.setSize(width, height, false);
        const bottom = height < 400 ? 48 : 68;
        const tableHeight = Math.max(80, height - bottom - 52);
        renderer.setViewport(0, bottom, width, tableHeight);
        camera.aspect = width / tableHeight;
        camera.updateProjectionMatrix();
        const corners = [-5.15, 5.15].flatMap(x => [-.5, .6].flatMap(y => [-7.6, 7.6].map(z => new THREE.Vector3(x, y, z))));
        for (let distance = 16; distance <= 80; distance += .5) {
          camera.position.set(0, distance * .85, distance * .53);
          camera.lookAt(0, 0, 0);
          camera.updateMatrixWorld();
          if (corners.every(point => {
            const projected = point.clone().project(camera);
            return Math.abs(projected.x) < .94 && Math.abs(projected.y) < .94;
          })) break;
        }
      }

      function frame(now) {
        const dt = window.arcadePaused ? 0 : Math.min(now - lastTime, 33.3);
        lastTime = now;
        if (!window.arcadePaused) {
          positionFlipper(leftFlipper, 175, keys.left ? -.42 : .34);
          positionFlipper(rightFlipper, 425, keys.right ? Math.PI + .42 : Math.PI - .34);
          if (state === 'playing') {
            const steps = Math.max(1, Math.ceil(dt / 8.333));
            for (let step = 0; step < steps; step++) Engine.update(engine, dt / steps);
          }
          if (drainDelay > 0 && (drainDelay -= dt) <= 0) { makeBall(); launch(); }
          if (targetResetDelay > 0 && (targetResetDelay -= dt) <= 0) resetTargetBank();
        }
        if (ball) {
          if (!window.arcadePaused && state === 'playing' && !leftPlungerLane && ball.position.y < 205) {
            Body.setVelocity(ball, { x: -8, y: ball.velocity.y });
            leftPlungerLane = true;
          }
          ballMesh.position.set(toX(ball.position.x), 13 / SCALE + .02, toZ(ball.position.y));
          ballMesh.rotation.x += ball.velocity.y * .002 * dt / 16.667;
          ballMesh.rotation.z -= ball.velocity.x * .002 * dt / 16.667;
          if (ball.position.y > H + 40) drain();
        }
        document.body.dataset.state = state;
        document.body.dataset.multiplier = String(multiplier);
        for (const body of engine.world.bodies) if (body.label === 'bumper') {
          const flash = Math.max(0, (flashes.get(body.id) || 0) - dt / 260);
          flashes.set(body.id, flash);
          meshes.get(body.id).children[2].position.y = .23 - flash * .075;
        }
        renderer.render(scene, camera);
        requestAnimationFrame(frame);
      }

      function setControl(side, pressed) {
        keys[side] = pressed;
        document.getElementById(side).classList.toggle('is-active', pressed);
      }

      addEventListener('keydown', event => {
        if (['KeyA', 'ArrowLeft'].includes(event.code)) setControl('left', true);
        else if (['KeyD', 'ArrowRight'].includes(event.code)) setControl('right', true);
        else if (event.code === 'Space') launch();
        else if (event.code === 'KeyR') { state = 'idle'; launch(); }
        else return;
        event.preventDefault();
      });
      addEventListener('keyup', event => {
        if (['KeyA', 'ArrowLeft'].includes(event.code)) setControl('left', false);
        if (['KeyD', 'ArrowRight'].includes(event.code)) setControl('right', false);
      });
      addEventListener('blur', () => { setControl('left', false); setControl('right', false); });
      for (const side of ['left', 'right']) {
        const button = document.getElementById(side);
        button.addEventListener('pointerdown', event => { event.preventDefault(); button.setPointerCapture(event.pointerId); setControl(side, true); });
        button.addEventListener('pointerup', () => setControl(side, false));
        button.addEventListener('pointercancel', () => setControl(side, false));
        button.addEventListener('lostpointercapture', () => setControl(side, false));
        button.addEventListener('keydown', event => {
          if (!['Space', 'Enter'].includes(event.code)) return;
          event.preventDefault(); setControl(side, true);
        });
        button.addEventListener('keyup', event => {
          if (['Space', 'Enter'].includes(event.code)) setControl(side, false);
        });
      }
      document.getElementById('start').addEventListener('click', launch);
      document.getElementById('launch').addEventListener('click', launch);
      addEventListener('resize', resize);
      document.addEventListener('visibilitychange', () => { lastTime = performance.now(); });

      makeBall();
      console.assert(THREE.REVISION === '160', 'Three.js revision');
      console.assert(engine.world.bodies.filter(body => body.label === 'bumper').length === 5, 'bumper setup');
      console.assert(targets.length === 3, 'target bank setup');
      console.assert(engine.world.bodies.filter(body => body.label === 'slingshot').length === 2, 'slingshot setup');
      resize();
      requestAnimationFrame(frame);
      document.body.dataset.selfCheck = 'ok';
      document.body.dataset.ready = 'true';
      addEventListener('load', () => window.lucide?.createIcons());
    })();
  </script>
</body>
</html>
