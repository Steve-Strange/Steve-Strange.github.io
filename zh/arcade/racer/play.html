<head>

<meta name="robots" content="noindex, follow"><link rel="canonical" href="https://steve-strange.github.io/zh/arcade/racer/"></head>
<body data-game="racer">
  <canvas id="game" aria-label="红色赛车在绿色田野间的公路上躲避车流"></canvas>
  <div class="topbar"><a class="back" href="/zh/arcade/?game=racer" aria-label="返回游戏室" title="返回游戏室"><i data-lucide="arrow-left"></i></a><div class="scores"><div><span>最高分</span><strong id="best">00000</strong></div><div><span>米</span><strong id="score">00000</strong></div></div></div>
  <div class="message" id="message"><h1 id="result">口袋赛车</h1><p class="standalone-help">← / → 转向，↓ / Space 刹车，R 重开。避开车流。</p><button id="start" type="button">开始驾驶</button></div>
  <div class="controls" aria-label="赛车控制"><button class="control" id="left" type="button" aria-label="左转" title="左转"><i data-lucide="arrow-left"></i></button><button class="control" id="brake" type="button" aria-label="刹车" title="刹车"><i data-lucide="octagon-pause"></i></button><button class="control" id="right" type="button" aria-label="右转" title="右转"><i data-lucide="arrow-right"></i></button></div>
  <p id="live" class="sr-only" role="status">等待开始</p>
</body>
