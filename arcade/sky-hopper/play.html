<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#9bcbd8">
  <meta name="description" content="An endless flying game with one-button controls.">
  <title>Sky Hopper｜Arcade Lab</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; }
    body { margin: 0; overflow: hidden; background: #18333a; color: #fff; font-family: Arial, "Microsoft YaHei", sans-serif; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    .back { position: fixed; top: max(14px, env(safe-area-inset-top)); left: 16px; z-index: 3; width: 42px; height: 42px; display: grid; place-items: center; color: #fff; background: #18333ad9; border: 1px solid #ffffff80; border-radius: 4px; text-decoration: none; font-size: 24px; }
    .best { position: fixed; top: max(14px, env(safe-area-inset-top)); right: 16px; z-index: 3; color: #18333a; text-align: right; pointer-events: none; }
    .best span { display: block; font-size: 10px; font-weight: 800; }
    .best strong { display: block; font-size: 23px; line-height: 1.1; }
    .message { position: fixed; top: 48%; left: 50%; z-index: 3; translate: -50% -50%; width: min(88vw, 390px); color: #18333a; text-align: center; }
    .message h1 { margin: 0 0 8px; font-size: 34px; letter-spacing: 0; }
    .message p { margin: 5px 0; font-size: 14px; line-height: 1.45; }
    .message .rules { font-weight: 800; }
    .message button { min-width: 144px; height: 44px; margin-top: 14px; border: 0; border-radius: 4px; color: #fff; background: #d94f50; font: 800 14px Arial, sans-serif; cursor: pointer; }
    .message[hidden] { display: none; }
    .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; }
  </style>
  <link rel="stylesheet" href="/assets/game-embed.css?v=20260917-bilingual">
  <script src="/assets/game-bridge.js?v=20260917-bilingual"></script>
<meta name="robots" content="noindex, follow"><link rel="canonical" href="https://steve-strange.github.io/arcade/sky-hopper/"></head>
<body>
  <canvas id="game" aria-label="A yellow bird flying between obstacles"></canvas>
  <a class="back" href="/arcade/" aria-label="Back to arcade" title="Back to arcade">‹</a>
  <div class="best"><span>BEST</span><strong id="best">0</strong></div>
  <div class="message" id="message">
    <h1>SKY HOPPER</h1>
    <p class="rules" id="rules">One point per pair of pipes · Hitting a pipe or the ground ends the game</p>
    <p id="controls-copy"><b>Space</b>, click or tap to flap　<b>R</b> Restart</p>
    <button type="button" id="start">START</button>
  </div>
  <p class="sr-only" id="live" aria-live="polite">Ready to start</p>
  <script src="/lib/matter/matter.min.js"></script>
  <script>
    (() => {
      'use strict';
      const { Engine, World, Bodies, Body, Events } = Matter;
      let W = 420;
      const H = 720;
      const R = 18;
      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');
      const message = document.getElementById('message');
      const rules = document.getElementById('rules');
      const controlsCopy = document.getElementById('controls-copy');
      const live = document.getElementById('live');
      const bestNode = document.getElementById('best');
      const engine = Engine.create({ enableSleeping: false });
      const bird = Bodies.circle(112, 340, R, { label: 'bird', restitution: 0, frictionAir: .015 });
      const ceiling = Bodies.rectangle(W / 2, -24, W, 48, { label: 'edge', isStatic: true });
      const ground = Bodies.rectangle(W / 2, H + 24, W, 48, { label: 'edge', isStatic: true });
      const pipes = [];
      let state = 'idle';
      let score = 0;
      let best = window.arcadeStorage.get('sky-hopper-best');
      let spawnTimer = 0;
      let lastTime = performance.now();
      let viewScale = 1;
      let viewX = 0;
      let viewY = 0;

      engine.gravity.y = 1.1;
      Body.setStatic(bird, true);
      World.add(engine.world, [bird, ceiling, ground]);
      bestNode.textContent = String(best);

      function addPipe() {
        const gap = Math.max(152, 190 - score * 2);
        const center = 190 + Math.random() * 320;
        const width = 68;
        const topHeight = center - gap / 2;
        const bottomY = center + gap / 2;
        const bottomHeight = H - bottomY;
        const top = Bodies.rectangle(W + 60, topHeight / 2, width, topHeight, { isStatic: true, label: 'pipe' });
        const bottom = Bodies.rectangle(W + 60, bottomY + bottomHeight / 2, width, bottomHeight, { isStatic: true, label: 'pipe' });
        World.add(engine.world, [top, bottom]);
        pipes.push({ top, bottom, width, scored: false });
      }

      function clearPipes() {
        for (const pipe of pipes) World.remove(engine.world, [pipe.top, pipe.bottom]);
        pipes.length = 0;
      }

      function reset(startPlaying = false) {
        clearPipes();
        Body.setStatic(bird, !startPlaying);
        Body.setPosition(bird, { x: 112, y: 340 });
        Body.setVelocity(bird, { x: 0, y: 0 });
        Body.setAngle(bird, 0);
        score = 0;
        spawnTimer = 950;
        state = startPlaying ? 'playing' : 'idle';
        message.hidden = startPlaying;
        if (startPlaying) flap();
      }

      function start() {
        reset(true);
        live.textContent = 'Flight started';
      }

      function flap() {
        if (state === 'idle' || state === 'over') return start();
        if (state !== 'playing') return;
        Body.setVelocity(bird, { x: 0, y: -8.4 });
        tone(520, .055);
        navigator.vibrate?.(7);
      }

      function end() {
        if (state !== 'playing') return;
        state = 'over';
        best = Math.max(best, score);
        window.arcadeStorage.set('sky-hopper-best', best);
        bestNode.textContent = String(best);
        message.querySelector('h1').textContent = score ? `SCORE ${score}` : 'TRY AGAIN';
        rules.textContent = `Score ${score} · Best ${best} points`;
        controlsCopy.textContent = 'Space, click or tap to restart · R to restart';
        message.querySelector('button').textContent = 'PLAY AGAIN';
        message.hidden = false;
        live.textContent = `Game over. Score: ${score}`;
        tone(95, .18);
      }

      function tone(frequency, duration) {
        window.arcadeTone(frequency, duration);
      }

      Events.on(engine, 'collisionStart', event => {
        if (event.pairs.some(pair => pair.bodyA === bird || pair.bodyB === bird)) end();
      });

      function resize() {
        const dpr = Math.min(devicePixelRatio || 1, 2);
        W = Math.max(420, H * innerWidth / innerHeight);
        Body.setPosition(ceiling, { x: W / 2, y: -24 });
        Body.setPosition(ground, { x: W / 2, y: H + 24 });
        Body.setVertices(ceiling, [{ x: 0, y: -48 }, { x: W, y: -48 }, { x: W, y: 0 }, { x: 0, y: 0 }]);
        Body.setVertices(ground, [{ x: 0, y: H }, { x: W, y: H }, { x: W, y: H + 48 }, { x: 0, y: H + 48 }]);
        canvas.width = Math.round(innerWidth * dpr);
        canvas.height = Math.round(innerHeight * dpr);
        viewScale = Math.min(innerWidth / W, innerHeight / H);
        viewX = (innerWidth - W * viewScale) / 2;
        viewY = (innerHeight - H * viewScale) / 2;
      }

      function update(dt) {
        if (state !== 'playing') return;
        const speed = (2.7 + Math.min(score, 20) * .035) * dt / 16.667;
        spawnTimer -= dt;
        if (spawnTimer <= 0) {
          addPipe();
          spawnTimer = Math.max(1180, 1540 - score * 12);
        }
        for (let i = pipes.length - 1; i >= 0; i--) {
          const pipe = pipes[i];
          Body.setPosition(pipe.top, { x: pipe.top.position.x - speed, y: pipe.top.position.y });
          Body.setPosition(pipe.bottom, { x: pipe.bottom.position.x - speed, y: pipe.bottom.position.y });
          if (!pipe.scored && pipe.top.position.x + pipe.width / 2 < bird.position.x) {
            pipe.scored = true;
            score += 1;
            live.textContent = `${score} points`;
            tone(760, .06);
          }
          if (pipe.top.position.x < -80) {
            World.remove(engine.world, [pipe.top, pipe.bottom]);
            pipes.splice(i, 1);
          }
        }
        const steps = Math.max(1, Math.ceil(dt / 16.667));
        for (let step = 0; step < steps; step++) Engine.update(engine, dt / steps);
        Body.setAngle(bird, Math.max(-.45, Math.min(1.1, bird.velocity.y * .07)));
        if (bird.position.y > H + R || bird.position.y < -R) end();
      }

      function cloud(x, y, size) {
        ctx.fillStyle = '#ffffffc7';
        ctx.beginPath();
        ctx.arc(x, y, size * .55, 0, Math.PI * 2);
        ctx.arc(x + size * .5, y - size * .18, size * .42, 0, Math.PI * 2);
        ctx.arc(x + size, y, size * .5, 0, Math.PI * 2);
        ctx.fill();
      }

      function drawPipe(body, top) {
        const bounds = body.bounds;
        const x = bounds.min.x;
        const y = bounds.min.y;
        const width = bounds.max.x - bounds.min.x;
        const height = bounds.max.y - bounds.min.y;
        ctx.fillStyle = '#244f45';
        ctx.fillRect(x, y, width, height);
        ctx.fillStyle = '#16352f';
        ctx.fillRect(x + 8, y, 11, height);
        ctx.fillStyle = '#d94f50';
        ctx.fillRect(x - 5, top ? y + height - 19 : y, width + 10, 19);
        ctx.strokeStyle = '#18333a';
        ctx.lineWidth = 3;
        ctx.strokeRect(x, y, width, height);
      }

      function drawBird() {
        ctx.save();
        ctx.translate(bird.position.x, bird.position.y);
        ctx.rotate(bird.angle);
        ctx.fillStyle = '#ffd166';
        ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#f29d49';
        ctx.beginPath(); ctx.ellipse(-8, 5, 11, 7, -.25, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#d94f50';
        ctx.beginPath(); ctx.moveTo(14, -1); ctx.lineTo(28, 4); ctx.lineTo(14, 8); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(7, -7, 6, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#18333a';
        ctx.beginPath(); ctx.arc(9, -7, 2.5, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }

      function draw() {
        const dpr = Math.min(devicePixelRatio || 1, 2);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.fillStyle = '#18333a';
        ctx.fillRect(0, 0, innerWidth, innerHeight);
        ctx.translate(viewX, viewY);
        ctx.scale(viewScale, viewScale);
        ctx.fillStyle = '#9bcbd8';
        ctx.fillRect(0, 0, W, H);
        for (let x = 42; x < W; x += 290) { cloud(x, 112, 34); cloud(x + 150, 185, 26); }
        ctx.fillStyle = '#6e9da5';
        for (let x = 0; x < W; x += 38) ctx.fillRect(x, 590 - (x % 76), 27, 130 + (x % 76));
        ctx.fillStyle = '#4d7777';
        ctx.fillRect(0, 665, W, 55);
        ctx.fillStyle = '#ffd166';
        for (let x = 13; x < W; x += 34) ctx.fillRect(x, 680, 8, 5);
        for (const pipe of pipes) { drawPipe(pipe.top, true); drawPipe(pipe.bottom, false); }
        drawBird();
        ctx.fillStyle = '#18333a';
        ctx.font = '900 42px Arial';
        ctx.textAlign = 'center';
        ctx.fillText(String(score), W / 2, 72);
      }

      function frame(now) {
        const dt = Math.min(now - lastTime, 33.3);
        lastTime = now;
        if (!window.arcadePaused) update(dt);
        document.body.dataset.state = state;
        canvas.dataset.score = String(score);
        canvas.dataset.state = state;
        draw();
        requestAnimationFrame(frame);
      }

      canvas.addEventListener('pointerdown', event => { event.preventDefault(); flap(); });
      document.getElementById('start').addEventListener('click', start);
      addEventListener('keydown', event => {
        if (event.repeat) return;
        if (event.code === 'Space') flap();
        else if (event.code === 'KeyR') start();
        else return;
        event.preventDefault();
      });
      addEventListener('resize', resize);
      document.addEventListener('visibilitychange', () => { lastTime = performance.now(); });
      resize();
      reset();
      console.assert(Matter.Collision.collides(bird, Bodies.rectangle(112, 340, 20, 80, { isStatic: true })), 'bird collision');
      requestAnimationFrame(frame);
      document.body.dataset.selfCheck = 'ok';
      document.body.dataset.ready = 'true';
    })();
  </script>
</body>
</html>
