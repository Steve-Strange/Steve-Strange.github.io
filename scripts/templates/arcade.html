<main id="main" class="arcade-main page-width">
    <section class="arcade-intro" aria-labelledby="arcade-title">
      <h1 id="arcade-title">Arcade Lab<span>游戏室</span></h1>
      <p class="arcade-count"><span class="status-dot"></span>6 款游戏 <span class="count-divider">/</span> 随时来一局</p>
    </section>
    <section class="play-layout" id="games" aria-label="游戏区">
      <div class="play-column">
        <div class="stage-bar">
          <div class="now-playing"><i data-lucide="gamepad-2"></i><span id="stage-name">反冲决斗</span><select id="game-picker" aria-label="切换游戏"></select></div>
          <div class="stage-tools">
            <button id="pause-game" class="tool" type="button" aria-label="暂停" title="暂停" aria-pressed="false"><i data-lucide="pause"></i></button>
            <button id="restart-game" class="tool" type="button" aria-label="重新开始" title="重新开始"><i data-lucide="rotate-ccw"></i></button>
            <button id="mute-game" class="tool" type="button" aria-label="静音" title="静音" aria-pressed="false"><i data-lucide="volume-2"></i></button>
            <button id="fullscreen-game" class="tool" type="button" aria-label="全屏" title="全屏"><i data-lucide="maximize"></i></button>
            <a id="open-game" class="tool" href="/recoil-duel/" target="_blank" rel="noopener" aria-label="独立打开游戏" title="独立打开"><i data-lucide="external-link"></i></a>
          </div>
        </div>
        <div class="game-stage" id="game-stage">
          <iframe id="game-frame" title="反冲决斗" src="/recoil-duel/?embed=1" allow="autoplay; fullscreen" tabindex="0"></iframe>
          <button class="pause-screen" id="resume-game" type="button" hidden><i data-lucide="play"></i><span>继续游戏</span></button>
          <p class="frame-error" id="frame-error" hidden>游戏未能载入。<button type="button" id="retry-game">重新载入</button></p>
        </div>
      </div>
      <aside class="game-info" aria-labelledby="game-title">
        <p class="game-type" id="game-type">01 / PHYSICS DUEL</p>
        <h2 id="game-title">反冲决斗</h2>
        <p class="game-tagline" id="game-tagline">每一枪，也是下一步。</p>
        <p class="game-description" id="game-description">零重力场地，青红双枪。枪口不停自旋，用开火的后坐力调整位置，也等待下一次瞄准。</p>
        <div class="game-mode" id="game-mode" role="group" aria-label="对战模式">
          <button type="button" data-mode="ai" aria-pressed="true">人机对战</button>
          <button type="button" data-mode="pvp" aria-pressed="false">本地双人</button>
        </div>
        <div class="info-section"><h3>玩法</h3><p id="game-rules">命中三次获胜。子弹相撞会抵消；枪体碰到边界会反弹。</p></div>
        <div class="info-section"><h3>操作</h3><dl class="key-list" id="game-controls"></dl></div>
        <div class="game-note"><i data-lucide="fingerprint"></i><span id="game-note">单键决斗 · 1–2 人</span></div>
        <p class="sr-only" id="arcade-live" role="status"></p>
      </aside>
    </section>
    <section class="game-shelf" aria-labelledby="shelf-title">
      <div class="shelf-heading"><h2 id="shelf-title">换个游戏</h2><span>THE COLLECTION / 06</span></div>
      <nav class="game-grid" aria-label="选择游戏">
        <a class="game-card" href="?game=recoil" data-game="recoil" aria-current="true"><img src="/assets/media/arcade-recoil.png" alt="青红双枪决斗" width="400" height="300"><span><b>反冲决斗</b><small>物理 · 双人</small></span><i data-lucide="arrow-up-right"></i></a>
        <a class="game-card" href="?game=pinball" data-game="pinball"><img src="/assets/media/arcade-pinball.png" alt="蓝色台面与红白碰撞器的经典三维弹球台" width="400" height="300"><span><b>3D Pinball</b><small>经典 · 弹球</small></span><i data-lucide="arrow-up-right"></i></a>
        <a class="game-card" href="?game=sky-hopper" data-game="sky-hopper"><img src="/assets/media/arcade-sky-hopper.png" alt="晴空小鸟与管道" width="400" height="300"><span><b>Sky Hopper</b><small>轻快 · 飞行</small></span><i data-lucide="arrow-up-right"></i></a>
        <a class="game-card" href="?game=gomoku" data-game="gomoku"><img src="/assets/media/arcade-gomoku.png" alt="木色棋盘上的黑白棋子" width="400" height="300"><span><b>五子棋</b><small>棋盘 · 策略</small></span><i data-lucide="arrow-up-right"></i></a>
        <a class="game-card" href="?game=dino" data-game="dino"><img src="/assets/media/arcade-dino.png" alt="像素小恐龙跳过仙人掌" width="400" height="300"><span><b>Dino Run</b><small>像素 · 跑酷</small></span><i data-lucide="arrow-up-right"></i></a>
        <a class="game-card" href="?game=racer" data-game="racer"><img src="/assets/media/arcade-racer.png" alt="红色赛车穿过公路车流" width="400" height="300"><span><b>Pocket Racer</b><small>复古 · 赛车</small></span><i data-lucide="arrow-up-right"></i></a>
      </nav>
    </section>
  </main>
