<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#5a8c65">
  <title>Pocket Racer｜Arcade Lab</title>
  <link rel="stylesheet" href="/assets/road-games.css">
  <link rel="stylesheet" href="/assets/game-embed.css">
  <script src="/assets/game-bridge.js"></script>
  <script defer src="/lib/lucide/lucide.min.js"></script>
  <script defer src="/lib/matter/matter.min.js"></script>
  <script defer src="/assets/road-games.js"></script>
</head>
<body data-game="racer">
  <canvas id="game" aria-label="红色赛车在绿色田野间的公路上躲避车流"></canvas>
  <div class="topbar"><a class="back" href="/arcade/?game=racer" aria-label="返回游戏室" title="返回游戏室"><i data-lucide="arrow-left"></i></a><div class="scores"><div><span>BEST</span><strong id="best">00000</strong></div><div><span>METERS</span><strong id="score">00000</strong></div></div></div>
  <div class="message" id="message"><h1 id="result">POCKET RACER</h1><p class="standalone-help">← / → 转向，↓ / Space 刹车，R 重开。避开车流。</p><button id="start" type="button">START ENGINE</button></div>
  <div class="controls" aria-label="赛车控制"><button class="control" id="left" type="button" aria-label="左转" title="左转"><i data-lucide="arrow-left"></i></button><button class="control" id="brake" type="button" aria-label="刹车" title="刹车"><i data-lucide="octagon-pause"></i></button><button class="control" id="right" type="button" aria-label="右转" title="右转"><i data-lucide="arrow-right"></i></button></div>
  <p id="live" class="sr-only" role="status">等待开始</p>
</body>
</html>
